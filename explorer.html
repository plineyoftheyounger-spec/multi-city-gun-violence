<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gun Violence Pre/Post Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --pre-color: #2a78d6;
    --post-color: #e34948;
  }
  html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; color: #222; }
  #app { display: flex; height: 100%; }
  #sidebar {
    width: 300px; flex: 0 0 300px; box-sizing: border-box; padding: 16px;
    background: #f7f7f8; border-right: 1px solid #ddd; overflow-y: auto;
  }
  #map { flex: 1 1 auto; }
  h1 { font-size: 1.05rem; margin: 0 0 2px; }
  p.sub { color: #777; font-size: 0.78rem; margin: 0 0 18px; }
  label { display: block; font-size: 0.78rem; font-weight: bold; color: #555; margin: 14px 0 4px; }
  label:first-of-type { margin-top: 0; }
  select {
    width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 0.85rem;
    border: 1px solid #bbb; border-radius: 4px; background: white;
  }

  /* Dual-handle range slider: two native <input type=range> stacked in one
     box, track hidden on both so only the shared fill bar + thumbs show. */
  .range-slider { position: relative; height: 22px; margin-top: 6px; }
  .range-track-bg {
    position: absolute; top: 9px; left: 0; right: 0; height: 4px;
    background: #ddd; border-radius: 2px;
  }
  .range-track-fill { position: absolute; top: 9px; height: 4px; border-radius: 2px; }
  #preSlider .range-track-fill { background: var(--pre-color); }
  #postSlider .range-track-fill { background: var(--post-color); }
  .range-input {
    position: absolute; top: 0; left: 0; width: 100%; height: 22px; margin: 0;
    background: transparent; pointer-events: none;
    -webkit-appearance: none; appearance: none;
  }
  .range-input::-webkit-slider-runnable-track { background: transparent; }
  .range-input::-webkit-slider-thumb {
    pointer-events: all; -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%; background: white;
    cursor: pointer; margin-top: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
  }
  .range-input::-moz-range-track { background: transparent; border: none; }
  .range-input::-moz-range-thumb {
    pointer-events: all; width: 15px; height: 15px; border-radius: 50%;
    background: white; cursor: pointer; box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
  }
  #preSlider .range-input::-webkit-slider-thumb,
  #preSlider .range-input::-moz-range-thumb { border: 2px solid var(--pre-color); }
  #postSlider .range-input::-webkit-slider-thumb,
  #postSlider .range-input::-moz-range-thumb { border: 2px solid var(--post-color); }
  .range-labels { display: flex; justify-content: space-between; font-size: 0.74rem; color: #555; margin-top: 4px; }

  #stats { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 14px; }
  #stats h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: 0 0 10px; }
  table.stat-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.stat-table th, table.stat-table td { padding: 4px 2px; text-align: right; }
  table.stat-table th:first-child, table.stat-table td:first-child { text-align: left; }
  table.stat-table th.pre { color: var(--pre-color); }
  table.stat-table th.post { color: var(--post-color); }
  table.stat-table td.delta-up { color: #b0362c; font-weight: bold; }
  table.stat-table td.delta-down { color: #1f7a3d; font-weight: bold; }
  .legend-note { font-size: 0.72rem; color: #888; margin-top: 14px; line-height: 1.5; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Pre/Post Explorer</h1>
    <p class="sub">Gun Violence Archive data, updated monthly</p>

    <label for="city">Area</label>
    <select id="city"></select>

    <label>Pre-period</label>
    <div class="range-slider" id="preSlider">
      <div class="range-track-bg"></div>
      <div class="range-track-fill" id="preFill"></div>
      <input type="range" class="range-input" id="preMin" />
      <input type="range" class="range-input" id="preMax" />
    </div>
    <div class="range-labels"><span id="preStartLabel"></span><span id="preEndLabel"></span></div>

    <label>Post-period</label>
    <div class="range-slider" id="postSlider">
      <div class="range-track-bg"></div>
      <div class="range-track-fill" id="postFill"></div>
      <input type="range" class="range-input" id="postMin" />
      <input type="range" class="range-input" id="postMax" />
    </div>
    <div class="range-labels"><span id="postStartLabel"></span><span id="postEndLabel"></span></div>

    <div id="stats">
      <h2>Pre vs. Post</h2>
      <table class="stat-table" id="statTable">
        <thead>
          <tr><th></th><th class="pre">Pre</th><th class="post">Post</th><th>Change</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="legend-note">
      <span class="swatch" style="background:var(--pre-color);"></span>Pre-period
      &nbsp;&nbsp;
      <span class="swatch" style="background:var(--post-color);"></span>Post-period
      <br />&#9670; at least one death &nbsp; &#9679; injury only
    </div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PRE_COLOR = "#2a78d6";
const POST_COLOR = "#e34948";

let ALL = { cities: [], incidents: [] };
let map, canvasRenderer, preLayer, postLayer;
let DATA_MIN_DATE, DATA_MAX_DATE, TOTAL_DAYS;

const citySel = document.getElementById("city");
const preMin = document.getElementById("preMin");
const preMax = document.getElementById("preMax");
const postMin = document.getElementById("postMin");
const postMax = document.getElementById("postMax");
const preFill = document.getElementById("preFill");
const postFill = document.getElementById("postFill");
const preStartLabel = document.getElementById("preStartLabel");
const preEndLabel = document.getElementById("preEndLabel");
const postStartLabel = document.getElementById("postStartLabel");
const postEndLabel = document.getElementById("postEndLabel");

function parseISO(s) { return new Date(s + "T00:00:00Z"); }
function toISO(d) { return d.toISOString().slice(0, 10); }
function addDays(d, n) { const r = new Date(d); r.setUTCDate(r.getUTCDate() + n); return r; }
function fmt(d) { return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
function dateFromIndex(i) { return addDays(DATA_MIN_DATE, i); }
function indexFromDate(d) { return Math.round((d - DATA_MIN_DATE) / 86400000); }

function initMap() {
  map = L.map("map", { preferCanvas: true });
  canvasRenderer = L.canvas({ padding: 0.5 });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    maxZoom: 19,
  }).addTo(map);
  preLayer = L.layerGroup().addTo(map);
  postLayer = L.layerGroup().addTo(map);
}

function markerFor(rec, color) {
  const popup = `<b>${fmt(parseISO(rec.date))}</b><br>${rec.a || ""}<br>Killed: ${rec.k} &nbsp;|&nbsp; Injured: ${rec.i}`;
  if (rec.k > 0) {
    const icon = L.divIcon({
      className: "",
      iconSize: [11, 11],
      iconAnchor: [5.5, 5.5],
      html: `<div style="width:11px;height:11px;background:${color};opacity:0.85;transform:rotate(45deg);border:1px solid rgba(0,0,0,0.35);"></div>`,
    });
    return L.marker([rec.lat, rec.lon], { icon }).bindPopup(popup, { maxWidth: 280 });
  }
  return L.circleMarker([rec.lat, rec.lon], {
    renderer: canvasRenderer, radius: 5, color, fill: true, fillOpacity: 0.72, weight: 1,
  }).bindPopup(popup, { maxWidth: 280 });
}

function summarize(rows) {
  return {
    incidents: rows.length,
    killed: rows.reduce((s, r) => s + r.k, 0),
    injured: rows.reduce((s, r) => s + r.i, 0),
    mass: rows.reduce((s, r) => s + (r.m ? 1 : 0), 0),
  };
}

function pctDelta(pre, post) {
  if (pre === 0) return post === 0 ? "0%" : "+∞";
  const pct = ((post - pre) / pre) * 100;
  return (pct >= 0 ? "+" : "") + pct.toFixed(0) + "%";
}

function renderStats(preStats, postStats) {
  const tbody = document.querySelector("#statTable tbody");
  const rows = [
    ["Incidents", preStats.incidents, postStats.incidents],
    ["Killed", preStats.killed, postStats.killed],
    ["Injured", preStats.injured, postStats.injured],
    ["Mass shootings", preStats.mass, postStats.mass],
  ];
  tbody.innerHTML = rows.map(([label, pre, post]) => {
    const cls = post > pre ? "delta-up" : (post < pre ? "delta-down" : "");
    return `<tr><td>${label}</td><td>${pre.toLocaleString()}</td><td>${post.toLocaleString()}</td><td class="${cls}">${pctDelta(pre, post)}</td></tr>`;
  }).join("");
}

function currentCityRecords() {
  const slug = citySel.value;
  return slug === "__all__" ? ALL.incidents : ALL.incidents.filter(r => r.city === slug);
}

// Dual-handle slider: two overlapping <input type=range> sharing one track.
// Each holds a day-index into [0, TOTAL_DAYS], mapped to a real date via
// DATA_MIN_DATE. Handles can't cross — dragging one past the other pushes it.
function setupDualSlider(minEl, maxEl, fillEl) {
  minEl.min = maxEl.min = 0;
  minEl.max = maxEl.max = TOTAL_DAYS;

  function clampAndRender() {
    let lo = parseInt(minEl.value, 10);
    let hi = parseInt(maxEl.value, 10);
    if (lo > hi) { lo = hi; minEl.value = lo; }
    fillEl.style.left = (lo / TOTAL_DAYS * 100) + "%";
    fillEl.style.width = ((hi - lo) / TOTAL_DAYS * 100) + "%";
  }
  minEl.addEventListener("input", clampAndRender);
  maxEl.addEventListener("input", () => {
    let lo = parseInt(minEl.value, 10);
    let hi = parseInt(maxEl.value, 10);
    if (hi < lo) { hi = lo; maxEl.value = hi; }
    clampAndRender();
  });
  return clampAndRender;
}

function sliderRange(minEl, maxEl) {
  return [dateFromIndex(parseInt(minEl.value, 10)), dateFromIndex(parseInt(maxEl.value, 10))];
}

function update() {
  const records = currentCityRecords();
  const [preStart, preEnd] = sliderRange(preMin, preMax);
  const [postStart, postEnd] = sliderRange(postMin, postMax);

  preStartLabel.textContent = fmt(preStart);
  preEndLabel.textContent = fmt(preEnd);
  postStartLabel.textContent = fmt(postStart);
  postEndLabel.textContent = fmt(postEnd);

  const preRows = records.filter(r => { const d = parseISO(r.date); return d >= preStart && d <= preEnd; });
  const postRows = records.filter(r => { const d = parseISO(r.date); return d >= postStart && d <= postEnd; });

  preLayer.clearLayers();
  postLayer.clearLayers();
  preRows.forEach(r => preLayer.addLayer(markerFor(r, PRE_COLOR)));
  postRows.forEach(r => postLayer.addLayer(markerFor(r, POST_COLOR)));

  renderStats(summarize(preRows), summarize(postRows));
}

function recenterMap() {
  const slug = citySel.value;
  if (slug === "__all__") {
    map.setView([39.5, -95], 4);
  } else {
    const cfg = ALL.cities.find(c => c.slug === slug);
    if (cfg) map.setView([cfg.lat, cfg.lon], cfg.zoom);
  }
}

function populateCitySelect() {
  const opts = [`<option value="__all__">All Cities</option>`]
    .concat(ALL.cities.map(c => `<option value="${c.slug}">${c.name}</option>`));
  citySel.innerHTML = opts.join("");
}

function computeDataRange() {
  let min = null, max = null;
  for (const r of ALL.incidents) {
    const d = parseISO(r.date);
    if (min === null || d < min) min = d;
    if (max === null || d > max) max = d;
  }
  DATA_MIN_DATE = min || new Date();
  DATA_MAX_DATE = max || new Date();
  TOTAL_DAYS = Math.round((DATA_MAX_DATE - DATA_MIN_DATE) / 86400000);
}

// Reading these from the URL lets a specific view (city + exact pre/post
// dates) be linked or embedded directly — useful as a Looker Studio
// "Embed URL" component, since Looker's own filters can't reach inside an
// iframe. Example:
// explorer.html?city=milwaukee&preStart=2024-03-01&preEnd=2024-08-31&postStart=2024-09-01&postEnd=2025-02-28&embed=1
function applyParamsFromURL() {
  const p = new URLSearchParams(window.location.search);
  if (p.has("city") && ALL.cities.some(c => c.slug === p.get("city"))) citySel.value = p.get("city");
  if (p.has("preStart")) preMin.value = indexFromDate(parseISO(p.get("preStart")));
  if (p.has("preEnd")) preMax.value = indexFromDate(parseISO(p.get("preEnd")));
  if (p.has("postStart")) postMin.value = indexFromDate(parseISO(p.get("postStart")));
  if (p.has("postEnd")) postMax.value = indexFromDate(parseISO(p.get("postEnd")));
  if (p.get("embed") === "1") document.getElementById("sidebar").style.display = "none";
}

fetch("output/explorer_data.json")
  .then(r => r.json())
  .then(data => {
    ALL = data;
    initMap();
    populateCitySelect();
    computeDataRange();

    const renderPreFill = setupDualSlider(preMin, preMax, preFill);
    const renderPostFill = setupDualSlider(postMin, postMax, postFill);

    // Default: two adjacent ~180-day windows ending at the most recent data,
    // mirroring what a first-time viewer probably wants to compare.
    preMin.value = indexFromDate(addDays(DATA_MAX_DATE, -360));
    preMax.value = indexFromDate(addDays(DATA_MAX_DATE, -181));
    postMin.value = indexFromDate(addDays(DATA_MAX_DATE, -180));
    postMax.value = indexFromDate(DATA_MAX_DATE);

    applyParamsFromURL();
    renderPreFill();
    renderPostFill();
    recenterMap();
    update();

    citySel.addEventListener("change", () => { recenterMap(); update(); });
    [preMin, preMax, postMin, postMax].forEach(el => el.addEventListener("input", update));
  })
  .catch(err => {
    document.getElementById("map").innerHTML =
      `<p style="padding:20px;color:#a00;">Could not load explorer_data.json (${err}). ` +
      `This page needs to be served over http(s) — opening it directly as a file:// URL ` +
      `won't work in most browsers. Run a local server (e.g. <code>python -m http.server</code>) ` +
      `or view it via GitHub Pages.</p>`;
  });
</script>
</body>
</html>
