name: Monthly GVA Data Update (Multi-City)

on:
  schedule:
    - cron: '0 8 2 * *'   # 2nd of every month at 8 AM UTC — a day after Orlando's own job
  workflow_dispatch:        # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run auto-update
        run: python auto_update_all.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data output index.html
          if git diff --staged --quiet; then
            echo "No new data."
          else
            git commit -m "data: monthly GVA update $(date +'%Y-%m-%d')"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 20 + 10))
            done
          fi
