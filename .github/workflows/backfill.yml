name: Backfill City Data

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'City slug to backfill (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - milwaukee
          - austin
          - miami
          - jackson_ms
          - cleveland
          - tucson

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run backfill
        run: |
          if [ "${{ inputs.city }}" = "all" ]; then
            python backfill.py
          else
            python backfill.py ${{ inputs.city }}
          fi

      - name: Rebuild maps
        run: |
          if [ "${{ inputs.city }}" = "all" ]; then
            python build_maps.py
          else
            python build_maps.py ${{ inputs.city }}
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data output/*/maps index.html
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "backfill: ${{ inputs.city }} $(date +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 10))
          done
          echo "::error::All push attempts failed"
          exit 1
